name: Deploy to Pages
on:
  push:
    branches: [main]
permissions:
  id-token: write
  pages: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: dist/
      - uses: actions/deploy-pages@v2
        id: deployment
